    <header><h1>英単語確認テスト</h1><p class="lead">範囲を選び、日本語訳を見て英単語を入力します。</p></header>

    <section class="card">
      <h2>1. 出題設定</h2>
      <p id="wordDataStatus" class="status">単語データを確認中です。</p>
      <div class="settings-grid">
        <div>
          <h3>Lessonを選ぶ</h3>
          <div class="row"><button id="selectAllLessonsBtn" class="ghost" type="button">すべて選択</button><button id="clearLessonsBtn" class="ghost" type="button">選択を解除</button></div>
          <div id="lessonList" class="lesson-list"></div>
        </div>
        <div>
          <h3>問題数</h3>
          <input id="questionCountInput" type="number" min="1" max="100" value="20" />
        </div>
      </div>
      <div id="errorMessage" class="error"></div>
    </section>

    <section class="card"><h2>2. テスト開始</h2><div class="row"><button id="startNormalBtn">選択した範囲で開始</button><button id="startReviewBtn" class="secondary">直近1日以内の間違いを復習</button><button id="showMistakesBtn" class="ghost">保存中の間違い一覧</button></div></section>

    <section id="quizSection" class="card hidden">
      <div class="quiz-meta"><span id="quizMode">通常テスト</span><span id="questionCounter">1 / 20</span></div>
      <div class="question-box"><p class="question-label">日本語訳</p><p id="japaneseQuestion" class="japanese">---</p></div>
      <label for="answerInput"><strong>英単語を入力</strong></label>
      <input id="answerInput" type="text" autocomplete="off" placeholder="例：apple" />
      <div id="feedback" class="feedback"></div><p id="correctAnswer" class="answer-text hidden"></p>
      <div class="row" style="margin-top:16px"><button id="submitBtn">解答する</button><button id="nextBtn" class="secondary hidden">次の問題へ</button></div>
    </section>

    <section id="resultSection" class="card hidden"><h2>結果</h2><p id="resultScore" class="result-score"></p><div id="wrongList"></div><div class="row" style="margin-top:16px"><button id="restartBtn">設定画面に戻る</button></div></section>

    <section id="mistakeSection" class="card hidden"><h2>保存中の間違い一覧</h2><p class="small">復習で正解した単語は、この一覧から削除されます。復習でまた間違えた単語は残ります。</p><div id="mistakeList"></div><div class="row" style="margin-top:16px"><button id="clearMistakesBtn" class="ghost">間違い記録を削除</button></div></section>

    const DEFAULT_TEST_COUNT=20, ONE_DAY_MS=24*60*60*1000, STORAGE_KEY="english_vocab_mistakes";
    let wordList=[], currentQuestions=[], currentIndex=0, correctCount=0, currentWrongAnswers=[], hasAnswered=false, currentIsReviewMode=false;

    const wordDataStatus=document.getElementById("wordDataStatus"), lessonList=document.getElementById("lessonList"), questionCountInput=document.getElementById("questionCountInput"), errorMessage=document.getElementById("errorMessage"), selectAllLessonsBtn=document.getElementById("selectAllLessonsBtn"), clearLessonsBtn=document.getElementById("clearLessonsBtn"), startNormalBtn=document.getElementById("startNormalBtn"), startReviewBtn=document.getElementById("startReviewBtn"), showMistakesBtn=document.getElementById("showMistakesBtn"), quizSection=document.getElementById("quizSection"), quizMode=document.getElementById("quizMode"), questionCounter=document.getElementById("questionCounter"), japaneseQuestion=document.getElementById("japaneseQuestion"), answerInput=document.getElementById("answerInput"), feedback=document.getElementById("feedback"), correctAnswer=document.getElementById("correctAnswer"), submitBtn=document.getElementById("submitBtn"), nextBtn=document.getElementById("nextBtn"), resultSection=document.getElementById("resultSection"), resultScore=document.getElementById("resultScore"), wrongList=document.getElementById("wrongList"), restartBtn=document.getElementById("restartBtn"), mistakeSection=document.getElementById("mistakeSection"), mistakeList=document.getElementById("mistakeList"), clearMistakesBtn=document.getElementById("clearMistakesBtn");

    initializeApp();
    selectAllLessonsBtn.addEventListener("click",selectAllLessons); clearLessonsBtn.addEventListener("click",clearLessons); startNormalBtn.addEventListener("click",startNormalTest); startReviewBtn.addEventListener("click",startReviewTest); showMistakesBtn.addEventListener("click",renderMistakeList); submitBtn.addEventListener("click",submitAnswer); nextBtn.addEventListener("click",goNextQuestion); restartBtn.addEventListener("click",()=>{hideAllMainSections();window.scrollTo({top:0,behavior:"smooth"})}); clearMistakesBtn.addEventListener("click",clearMistakes);
    answerInput.addEventListener("keydown",e=>{if(e.key==="Enter"){if(!hasAnswered)submitAnswer();else goNextQuestion();}});

    function initializeApp(){try{wordList=normalizeWordData(WORD_DATA);renderLessonCheckboxes(wordList);selectAllLessons();wordDataStatus.textContent=`${wordList.length}語を読み込みました。Lessonを選んで開始してください。`;}catch(error){wordList=[];startNormalBtn.disabled=true;wordDataStatus.textContent="単語データの読み込みに失敗しました。";showError(error.message);}}
    function normalizeWordData(data){if(!Array.isArray(data))throw new Error("WORD_DATAは配列で指定してください。");const normalized=data.map((row,index)=>({english:String(row.english||"").trim(),japanese:String(row.japanese||"").trim(),lesson:String(row.lesson||"").trim(),originalIndex:index+1}));const invalidRows=normalized.filter(w=>!w.english||!w.japanese||!w.lesson);if(invalidRows.length>0)throw new Error(`english, japanese, lesson のいずれかが空のデータがあります。該当位置: ${invalidRows.map(w=>w.originalIndex).join(", ")}`);return normalized;}
    function renderLessonCheckboxes(words){const lessons=getLessons(words);lessonList.innerHTML=lessons.map(lesson=>{const count=words.filter(w=>w.lesson===lesson).length;return `<label class="lesson-item"><input type="checkbox" name="lesson" value="${escapeHtml(lesson)}" /><span>${escapeHtml(lesson)}（${count}）</span></label>`}).join("");}
    function getLessons(words){return Array.from(new Set(words.map(w=>w.lesson))).sort((a,b)=>a.localeCompare(b,"ja",{numeric:true}));}
    function selectAllLessons(){getLessonCheckboxes().forEach(c=>c.checked=true)}
    function clearLessons(){getLessonCheckboxes().forEach(c=>c.checked=false)}
    function getLessonCheckboxes(){return Array.from(document.querySelectorAll('input[name="lesson"]'))}
    function getSelectedLessons(){return getLessonCheckboxes().filter(c=>c.checked).map(c=>c.value)}
    function getRequestedQuestionCount(){const value=Number(questionCountInput.value);if(!Number.isInteger(value)||value<1)throw new Error("問題数は1以上の整数で入力してください。");return value;}

    function startNormalTest(){try{clearError();if(wordList.length===0)throw new Error("単語データがありません。");const selectedLessons=getSelectedLessons();if(selectedLessons.length===0)throw new Error("出題するLessonを1つ以上選択してください。");const requestedCount=getRequestedQuestionCount();const targetWords=wordList.filter(w=>selectedLessons.includes(w.lesson));if(targetWords.length===0)throw new Error("選択したLessonに出題できる単語がありません。");const count=Math.min(requestedCount,targetWords.length);startQuiz(shuffleArray(targetWords).slice(0,count),`通常テスト：${selectedLessons.join(", ")}`,false);}catch(error){showError(error.message)}}
    function startReviewTest(){const reviewWords=getRecentMistakes();if(reviewWords.length===0){hideAllMainSections();resultSection.classList.remove("hidden");resultScore.textContent="直近1日以内の間違いはありません。";wrongList.innerHTML="";return;}let requestedCount=DEFAULT_TEST_COUNT;try{requestedCount=getRequestedQuestionCount()}catch(error){requestedCount=DEFAULT_TEST_COUNT}const count=Math.min(requestedCount,reviewWords.length);startQuiz(shuffleArray(reviewWords).slice(0,count),"直近1日以内の間違い復習",true);}
    function startQuiz(questions,modeText,isReviewMode=false){hideAllMainSections();quizSection.classList.remove("hidden");currentQuestions=questions;currentIndex=0;correctCount=0;currentWrongAnswers=[];currentIsReviewMode=isReviewMode;quizMode.textContent=modeText;showQuestion();}

    function showQuestion(){hasAnswered=false;const q=currentQuestions[currentIndex];questionCounter.textContent=`${currentIndex+1} / ${currentQuestions.length}`;japaneseQuestion.textContent=q.japanese;answerInput.value="";answerInput.disabled=false;answerInput.focus();feedback.className="feedback";feedback.textContent="";correctAnswer.classList.add("hidden");correctAnswer.textContent="";submitBtn.classList.remove("hidden");nextBtn.classList.add("hidden");}
    function submitAnswer(){if(hasAnswered)return;const q=currentQuestions[currentIndex];const userAnswer=normalizeAnswer(answerInput.value), correct=normalizeAnswer(q.english);if(userAnswer===""){showError("解答を入力してください。");answerInput.focus();return;}clearError();hasAnswered=true;answerInput.disabled=true;submitBtn.classList.add("hidden");nextBtn.classList.remove("hidden");if(userAnswer===correct){correctCount++;feedback.className="feedback correct";feedback.textContent=currentIsReviewMode?"正解です。復習リストから削除しました。":"正解です。";if(currentIsReviewMode)removeMistake(q);}else{feedback.className="feedback incorrect";feedback.textContent=currentIsReviewMode?"不正解です。この単語は復習リストに残ります。":"不正解です。";correctAnswer.classList.remove("hidden");correctAnswer.textContent=`正解: ${q.english}`;currentWrongAnswers.push(q);saveMistake(q);}nextBtn.focus();}
    function goNextQuestion(){if(!hasAnswered)return;currentIndex++;if(currentIndex>=currentQuestions.length)showResult();else showQuestion();}
    function normalizeAnswer(value){return String(value).trim().toLowerCase();}

    function showResult(){hideAllMainSections();resultSection.classList.remove("hidden");const total=currentQuestions.length, percentage=Math.round((correctCount/total)*100);resultScore.textContent=`${total}問中 ${correctCount}問正解（${percentage}%）`;if(currentWrongAnswers.length===0){wrongList.innerHTML=currentIsReviewMode?"<p>今回の復習で間違えた単語はありません。</p>":"<p>間違えた単語はありません。</p>";return;}wrongList.innerHTML=`<h3>今回間違えた単語</h3>${createWordTable(currentWrongAnswers)}`;}

    function getAllMistakes(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):[]}catch(error){console.error(error);return[]}}
    function saveMistake(word){const mistakes=getAllMistakes();const key=normalizeAnswer(word.english);const index=mistakes.findIndex(item=>normalizeAnswer(item.english)===key);const record={english:word.english,japanese:word.japanese,lesson:word.lesson||"",timestamp:Date.now()};if(index>=0)mistakes[index]=record;else mistakes.push(record);localStorage.setItem(STORAGE_KEY,JSON.stringify(mistakes));}
    function removeMistake(word){const key=normalizeAnswer(word.english);const mistakes=getAllMistakes().filter(item=>normalizeAnswer(item.english)!==key);localStorage.setItem(STORAGE_KEY,JSON.stringify(mistakes));}
    function getRecentMistakes(){const now=Date.now();return getAllMistakes().filter(item=>now-item.timestamp<=ONE_DAY_MS).sort((a,b)=>b.timestamp-a.timestamp);}
    function renderMistakeList(){hideAllMainSections();mistakeSection.classList.remove("hidden");const mistakes=getAllMistakes();if(mistakes.length===0){mistakeList.innerHTML="<p>保存中の間違いはありません。</p>";return;}const sorted=[...mistakes].sort((a,b)=>b.timestamp-a.timestamp);mistakeList.innerHTML=`<p><strong>${mistakes.length}件</strong>の間違いが保存されています。</p><table><thead><tr><th>Lesson</th><th>英単語</th><th>日本語</th><th>日時</th></tr></thead><tbody>${sorted.map(item=>`<tr><td>${escapeHtml(item.lesson||"")}</td><td>${escapeHtml(item.english)}</td><td>${escapeHtml(item.japanese)}</td><td>${formatDate(item.timestamp)}</td></tr>`).join("")}</tbody></table>`;}
    function clearMistakes(){if(!confirm("保存中の間違い記録をすべて削除しますか？"))return;localStorage.removeItem(STORAGE_KEY);renderMistakeList();}

    function shuffleArray(array){const copied=[...array];for(let i=copied.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copied[i],copied[j]]=[copied[j],copied[i]]}return copied;}
    function hideAllMainSections(){quizSection.classList.add("hidden");resultSection.classList.add("hidden");mistakeSection.classList.add("hidden");clearError();}
    function showError(message){errorMessage.textContent=message;errorMessage.style.display="block";}
    function clearError(){errorMessage.textContent="";errorMessage.style.display="none";}
    function createWordTable(words){return `<table><thead><tr><th>Lesson</th><th>英単語</th><th>日本語</th></tr></thead><tbody>${words.map(w=>`<tr><td>${escapeHtml(w.lesson||"")}</td><td>${escapeHtml(w.english)}</td><td>${escapeHtml(w.japanese)}</td></tr>`).join("")}</tbody></table>`;}
    function formatDate(timestamp){return new Date(timestamp).toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});}
    function escapeHtml(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
  </script>
